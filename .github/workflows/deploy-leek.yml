# Déploie src/ sur le compte principal Leek Wars.
# Déclenché à la main (Actions > Run workflow, sur la branche par défaut) : le workflow pose alors lui-même le tag
# `leek-AAAAMMJJ-HHMM` sur le commit déployé, publié seulement si le déploiement réussit. Un tag `leek-*` poussé
# directement le déclenche aussi (impossible depuis une session Claude cloud : elle ne peut pousser que sa branche).
# Garden écrit aussi DEPLOYED.ts à la racine des IA du site : version, date, origine et ligne Stratégie.
# Secrets (Settings > Secrets and variables > Actions) : LEEKWARS_LOGIN et LEEKWARS_PASSWORD (connexion par login :
# crée les IA et dossiers absents du site, et peut mettre à la corbeille ceux absents du dépôt), sinon
# LEEKWARS_API_KEY seule (écrit dans les IA existantes, ne crée et ne supprime rien).
name: Déploiement Leek Wars

on:
  push:
    tags: ["leek-*"]
  workflow_dispatch:
    inputs:
      supprimer:
        description: "Mettre à la corbeille les IA du site absentes du dépôt (connexion par login seulement)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leek-default-branch-writes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLICATIONS: LWGarden/Data/publications.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un déploiement depuis une branche non fusionnée laisse le site en avance sur la branche par défaut.
      - name: Refuser un commit absent de la branche par défaut
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::${GITHUB_SHA::12} (${GITHUB_REF_NAME}) n'est pas dans $DEFAULT_BRANCH : fusionne d'abord, puis déploie."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          npm ci
          npm run typecheck
          npm test
          python -m pip install --quiet -r LWGarden/src/requirements.txt
          python -m unittest discover -s LWGarden/tests -p "test*.py"

      - name: Reprendre l'historique des publications de la branche par défaut
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          mkdir -p "$(dirname "$PUBLICATIONS")"
          git show "origin/$DEFAULT_BRANCH:$PUBLICATIONS" > "$PUBLICATIONS" || rm -f "$PUBLICATIONS"

      # Posé avant le PUSH pour que DEPLOYED.ts cite le tag (`git tag --points-at HEAD`) ; publié après, si tout réussit.
      - name: Préparer le tag de déploiement (lancement manuel)
        if: github.ref_type != 'tag'
        run: |
          TAG="leek-$(date -u +%Y%m%d-%H%M)"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "Déploiement : $(git log -1 --format=%s "$GITHUB_SHA")" "$GITHUB_SHA"
          echo "DEPLOY_TAG=$TAG" >> "$GITHUB_ENV"

      - name: PUSH Garden vers Leek Wars
        env:
          LEEKWARS_LOGIN: ${{ secrets.LEEKWARS_LOGIN }}
          LEEKWARS_PASSWORD: ${{ secrets.LEEKWARS_PASSWORD }}
          LEEKWARS_API_KEY: ${{ secrets.LEEKWARS_API_KEY }}
          LEEKWARS_DELETE_REMOTE_ONLY: ${{ inputs.supprimer == true }}
        run: python LWGarden/src/Garden.py push

      # Un tag poussé avec GITHUB_TOKEN ne relance pas ce workflow.
      - name: Publier le tag de déploiement
        if: env.DEPLOY_TAG != ''
        run: git push origin "refs/tags/$DEPLOY_TAG"

      - name: Enregistrer la publication sur la branche par défaut
        run: |
          if [ ! -f "$PUBLICATIONS" ]; then echo "Aucune publication à enregistrer."; exit 0; fi
          cp "$PUBLICATIONS" "$RUNNER_TEMP/publications.json"
          git checkout --force -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/publications.json" "$PUBLICATIONS"
          git add "$PUBLICATIONS"
          if git diff --cached --quiet; then echo "Version déjà enregistrée."; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(data): publication ${DEPLOY_TAG:-$GITHUB_REF_NAME} (${GITHUB_SHA::12})"
          git push origin "$DEFAULT_BRANCH"
