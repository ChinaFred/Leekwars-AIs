# Supprime les branches de session `ccr-*` dont tout le contenu est déjà dans la branche par défaut.
# Chaque session Claude Code cloud pousse sa propre branche `ccr-*` ; rien ne la retire après fusion, ni quand
# la session n'a rien committé. Une branche portant un commit non fusionné n'est jamais touchée.
name: Nettoyage des branches

on:
  push:
    branches: [Master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Supprimer les branches ccr-* fusionnées
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:lstrip=3)' --merged "origin/$DEFAULT_BRANCH" 'refs/remotes/origin/ccr-*' |
            while read -r branch; do
              echo "Suppression de $branch (déjà dans $DEFAULT_BRANCH)"
              git push origin --delete "$branch" || echo "::warning::$branch n'a pas pu être supprimée"
            done
          echo "Branches restantes avec du travail non fusionné :"
          git for-each-ref --format='  %(refname:lstrip=3)' --no-merged "origin/$DEFAULT_BRANCH" 'refs/remotes/origin/*'
